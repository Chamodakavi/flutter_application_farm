name: farmfriend
description: FarmFriend farmer mobile app
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  cached_network_image: ^4.0.4
  connectivity_plus: ">=6.1.0 <7.3.2"
  dio: ^5.11.1
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_image_compress: ^2.5.1
  flutter_local_notifications: 22.3.1
  flutter_localizations:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.0
  flutter_tts: ^4.2.5
  freezed_annotation: ^3.1.0
  go_router: ^18.0.2
  google_sign_in: ^7.2.0
  hive_ce: ^2.20.1
  hive_ce_flutter: ^2.4.0
  image_picker: ^1.2.3
  intl: ^0.20.3
  json_annotation: ^4.12.0
  logger: ^2.8.0
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  sentry_flutter: 9.30.1
  share_plus: ^13.3.1
  shimmer: ^4.0.0
  speech_to_text: ^7.5.0
  supabase_flutter: ^2.18.0
  url_launcher: ^6.3.3
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  freezed: ^4.0.2
  json_serializable: ^6.14.1
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/data/ # districts.json, crops_i18n.json
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
    - family: NotoSansSinhala
      fonts:
        - asset: assets/fonts/NotoSansSinhala-Regular.ttf
        - asset: assets/fonts/NotoSansSinhala-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansSinhala-Bold.ttf
          weight: 700
    - family: NotoSansTamil
      fonts:
        - asset: assets/fonts/NotoSansTamil-Regular.ttf
        - asset: assets/fonts/NotoSansTamil-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansTamil-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/icons/app_icon.png
  adaptive_icon_background: "#0E2A1C"
  adaptive_icon_foreground: assets/icons/app_icon_foreground.png

flutter_native_splash:
  color: "#0E2A1C"
  image: assets/icons/splash_logo.png
  android_12:
    color: "#0E2A1C"
    image: assets/icons/splash_logo.png
